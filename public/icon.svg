    <path d="M174 238c12 10 23 15 37 16 14 1 24 8 32 18 5 7 9 12 13 13 5-1 9-6 14-13 8-10 18-17 32-18 14-1 25-6 37-16 1 37-6 72-22 99-15 24-36 40-61 47-25-7-46-23-61-47-16-27-23-62-21-99Z" fill="url(#beard)" />
