<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stylized portrait of Narendra Modi">
  <defs>
    <linearGradient id="background" x1="40" y1="20" x2="472" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4DC" />
      <stop offset="1" stop-color="#E7C894" />
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="matrix(0 190 -190 0 256 207)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF9EC" />
      <stop offset="1" stop-color="#E9D5AF" />
    </radialGradient>
    <linearGradient id="skin" x1="185" y1="149" x2="322" y2="318" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F1BF91" />
      <stop offset="1" stop-color="#D99161" />
    </linearGradient>
    <linearGradient id="beard" x1="186" y1="238" x2="319" y2="389" gradientUnits="userSpaceOnUse">
