    <path d="M173 190c-16-19-19-47-9-69 7-15 20-24 34-28 8-27 31-44 58-44 26 0 48 14 58 37 21 4 39 21 43 44 4 22-3 45-18 62l-8-25c-6-16-16-28-29-37-19 10-38 14-59 12-24-2-42-10-55-22-8 11-12 27-12 44l-3 26Z" fill="#F4F1E8" />
