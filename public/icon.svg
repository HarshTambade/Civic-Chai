    <linearGradient id="vest" x1="178" y1="372" x2="329" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F47A18" />
      <stop offset="1" stop-color="#C94A0D" />
    </linearGradient>
    <clipPath id="frame"><rect width="512" height="512" rx="116" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="512" height="512" fill="url(#background)" />
    <circle cx="256" cy="213" r="177" fill="url(#halo)" />
